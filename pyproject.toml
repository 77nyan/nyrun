[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyrun"
version = "1.6.0"
description = "NyRun - a cozy poster-based TUI video and music selector that launches your films, shows and albums in VLC."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jakub Ziaja" }]
keywords = ["tui", "vlc", "video", "movies", "music", "terminal", "textual", "media-launcher"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=8.0",
    "textual-image>=0.14",
    "pillow>=10",
    "mutagen>=1.47",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/77nyan/nyrun"
Issues = "https://github.com/77nyan/nyrun/issues"

[project.scripts]
nyrun = "nyrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
