name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (used by the URL download tests)
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true  # the ffmpeg tests skip themselves when it is missing
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v --durations=10
